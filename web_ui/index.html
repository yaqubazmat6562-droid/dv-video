<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7c5cff">
<title>DV Studio Mobile</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Header -->
<header class="app-header">
  <div class="logo">🎬 DV Studio</div>
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
</header>

<main class="app-main">

  <!-- Upload Section -->
  <section id="upload-section" class="card">
    <h2>📤 Upload Video</h2>
    <label for="file-input" class="upload-btn">
      <span class="upload-icon">📁</span>
      <span>Choose File</span>
    </label>
    <input type="file" id="file-input" accept="video/*" hidden>

    <div id="upload-info" class="hidden">
      <p><strong>File:</strong> <span id="file-name"></span></p>
      <p><strong>Duration:</strong> <span id="file-duration"></span> sec</p>
    </div>
  </section>

  <!-- Preview -->
  <section id="preview-section" class="card hidden">
    <h2>🎥 Preview</h2>
    <video id="preview-video" controls playsinline></video>
  </section>

  <!-- Actions -->
  <section id="actions-section" class="card hidden">
    <h2>🛠 Select Action</h2>

    <div class="action-grid">
      <button class="action-btn" onclick="showPanel('trim')">✂️ Trim</button>
      <button class="action-btn" onclick="showPanel('speed')">⚡ Speed</button>
      <button class="action-btn" onclick="showPanel('filter')">🎨 Filter</button>
      <button class="action-btn" onclick="showPanel('text')">📝 Text</button>
    </div>

    <!-- Trim Panel -->
    <div id="panel-trim" class="panel hidden">
      <h3>✂️ Trim Video</h3>
      <label>Start (sec): <input type="number" id="trim-start" value="0" step="0.1" min="0"></label>
      <label>End (sec): <input type="number" id="trim-end" value="5" step="0.1" min="0"></label>
      <button class="primary-btn" onclick="applyTrim()">✅ Apply</button>
    </div>

    <!-- Speed Panel -->
    <div id="panel-speed" class="panel hidden">
      <h3>⚡ Speed</h3>
      <input type="range" id="speed-slider" min="0.25" max="4" step="0.25" value="1">
      <p>Speed: <span id="speed-value">1.0</span>x</p>
      <button class="primary-btn" onclick="applySpeed()">✅ Apply</button>
    </div>

    <!-- Filter Panel -->
    <div id="panel-filter" class="panel hidden">
      <h3>🎨 Filter</h3>
      <select id="filter-preset">
        <option value="None">None</option>
        <option value="Cinematic">Cinematic</option>
        <option value="Vintage">Vintage</option>
        <option value="B&W">B&W</option>
        <option value="Warm">Warm</option>
        <option value="Cool">Cool</option>
        <option value="Vivid">Vivid</option>
        <option value="Dramatic">Dramatic</option>
      </select>
      <button class="primary-btn" onclick="applyFilter()">✅ Apply</button>
    </div>

    <!-- Text Panel -->
    <div id="panel-text" class="panel hidden">
      <h3>📝 Text Overlay</h3>
      <input type="text" id="text-input" placeholder="Enter text...">
      <select id="text-pos">
        <option value="top">Top</option>
        <option value="middle">Middle</option>
        <option value="bottom">Bottom</option>
      </select>
      <select id="text-color">
        <option value="white">White</option>
        <option value="yellow">Yellow</option>
        <option value="red">Red</option>
        <option value="black">Black</option>
      </select>
      <button class="primary-btn" onclick="applyText()">✅ Apply</button>
    </div>

  </section>

  <!-- Result -->
  <section id="result-section" class="card hidden">
    <h2>✅ Result</h2>
    <video id="result-video" controls playsinline></video>
    <a id="download-btn" class="primary-btn" download>⬇️ Download</a>
  </section>

  <!-- Loading -->
  <div id="loading" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p id="loading-text">Processing...</p>
  </div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
